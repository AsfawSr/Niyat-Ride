# Application
spring.application.name=ride

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/niyat_ride?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Let Hibernate choose dialect automatically (MySQL)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Swagger Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.cache.disabled=true

# JWT
# IMPORTANT: set a strong secret in production (or via environment)
jwt.secret=${JWT_SECRET:w6R2i1xC7M8qZ5vL0bYpD3tN6uH9kJ2sQ4fV7xAaBbCcDdEeFfGgHhIiJjKkLlMm}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# Debugging
logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG

# File Uploads
files.upload.base-dir=${FILES_UPLOAD_BASE_DIR:uploads}
files.upload.max-size-bytes=${FILES_UPLOAD_MAX_SIZE_BYTES:5242880}
files.upload.allowed-content-types=${FILES_UPLOAD_ALLOWED_CT:image/jpeg,image/png,application/pdf}