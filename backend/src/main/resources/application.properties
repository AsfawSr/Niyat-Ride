# Server configuration for Render
server.port=${PORT:8080}
server.address=0.0.0.0


# Application configuration
spring.profiles.active=prod

# Database - PostgreSQL with PostGIS (configurable via env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pooling
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA with PostgreSQL and PostGIS
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# PostGIS specific configuration
spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisPGDialect

# Swagger Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.cache.disabled=true

# Debugging
logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG


